apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  labels:
    purpose: roboshop
    environment: dev
    app: app2
  namespace: roboshop
spec:
  # Specify replicas to be created
  replicas: 2
  selector:
    matchLabels:
      purpose: roboshop
      environment: dev
      app: app2
  template:
    # pod definition
    metadata:
      labels:
        purpose: roboshop
        environment: dev
        app: app2
    spec:
      containers:
        - name: app2
          image: vamsi562/app2:v1
